{{ define "main" }}
  {{ partial "page-header" . }}


  <section class="section">
    <div class="container">
      <div class="row">
        {{ range .RegularPages }}
          <div class="md:col-6 mb-14">
            {{ partial "components/code-card" . }}
          </div>
        {{ end }}
      </div>
    </div>
  </section>

  <!-- GitHub Stars 数据获取脚本（全局）-->
  <script>
  // 获取 GitHub Stars 数量
  async function fetchGitHubStars(repo) {
      try {
          const response = await fetch(`https://api.github.com/repos/${repo}`);
          if (!response.ok) throw new Error('API request failed');
          const data = await response.json();
          return data.stargazers_count;
      } catch (error) {
          console.error('Failed to fetch GitHub stars:', error);
          return null;
      }
  }

  // 格式化数字（超过 1000 显示 k）
  function formatStarCount(count) {
      if (count >= 1000) {
          return (count / 1000).toFixed(1) + 'k';
      }
      return count.toString();
  }

  // 更新页面上的 Star 数量
  async function updateStarCounts() {
      const starElements = document.querySelectorAll('.star-count[data-repo]');
      
      for (const element of starElements) {
          const repo = element.getAttribute('data-repo');
          if (!repo) continue;
          
          const stars = await fetchGitHubStars(repo);
          if (stars !== null) {
              element.textContent = formatStarCount(stars);
              element.classList.add('loaded');
              
              // 缓存到 localStorage（24小时有效）
              const cacheKey = `github_stars_${repo}`;
              const cacheData = {
                  stars: stars,
                  timestamp: Date.now()
              };
              localStorage.setItem(cacheKey, JSON.stringify(cacheData));
          } else {
              element.textContent = '-';
          }
      }
  }

  // 从缓存加载或获取新数据
  function loadStarCounts() {
      const starElements = document.querySelectorAll('.star-count[data-repo]');
      
      starElements.forEach(element => {
          const repo = element.getAttribute('data-repo');
          if (!repo) return;
          
          // 尝试从缓存读取
          const cacheKey = `github_stars_${repo}`;
          const cached = localStorage.getItem(cacheKey);
          
          if (cached) {
              try {
                  const { stars, timestamp } = JSON.parse(cached);
                  const age = Date.now() - timestamp;
                  
                  // 缓存 24 小时内有效
                  if (age < 24 * 60 * 60 * 1000) {
                      element.textContent = formatStarCount(stars);
                      element.classList.add('loaded');
                      return;
                  }
              } catch (e) {
                  console.error('Cache parse error:', e);
              }
          }
      });
      
      // 获取新数据
      updateStarCounts();
  }

  // 页面加载时执行
  if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadStarCounts);
  } else {
      loadStarCounts();
  }
  </script>
{{ end }}
