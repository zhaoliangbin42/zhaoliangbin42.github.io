{{ define "main" }}
  <section class="pt-7 pb-0">
    <div class="container">
      <!-- 面包屑导航 -->
      {{ partial "breadcrumb.html" . }}
    </div>
  </section>

  {{ partial "page-header" . }}

  <section class="section">
    <div class="container">
      <div class="row gx-5">
        <!-- blog posts -->
        <div class="lg:col-12">
          <div class="row">
            {{ range .Data.Pages }}
              <div class="lg:col-4 md:col-6 sm:col-12 mb-14">
                {{ partial "components/blog-card" . }}
              </div>
            {{ end }}
          </div>
        </div>
      </div>
    </div>
  </section>
{{ end }}
