{{ $isEN := eq (.Params.amd_lang | default "zh") "en" }}
<header class="amd-signal-info-intro amd-container">
  <p class="amd-signal-eyebrow">AI-MarkDone</p>
  <h1>{{ .Title }}</h1>
  <p class="amd-signal-info-lede">{{ .Description }}</p>
</header>
<div class="amd-container">
  <article class="amd-workflow-article">
    <nav
      class="amd-workflow-toc"
      aria-label="{{ if $isEN }}
        Choose a workflow
      {{ else }}
        选择工作流
      {{ end }}"
    >
      {{ .TableOfContents }}
    </nav>
    <div class="amd-docs-content content">{{ .Content }}</div>
  </article>
</div>
