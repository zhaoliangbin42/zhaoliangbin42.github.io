{{ if site.Params.giscus.enable }}
<div class="giscus-wrapper"><div class="giscus-header"><h2>{{ cond (eq .Language.Lang "en") "Discussion" "欢迎讨论" }}</h2></div>
<div id="giscus-container" class="giscus-container"></div>
<script src="https://giscus.app/client.js"
 data-repo="{{ site.Params.giscus.repo }}" data-repo-id="{{ site.Params.giscus.repoID }}"
 data-category="{{ site.Params.giscus.category }}" data-category-id="{{ site.Params.giscus.categoryID }}"
 data-mapping="pathname" data-strict="{{ site.Params.giscus.strict }}"
 data-reactions-enabled="{{ site.Params.giscus.reactionsEnabled }}" data-emit-metadata="{{ site.Params.giscus.emitMetadata }}"
 data-input-position="{{ site.Params.giscus.inputPosition }}" data-theme="light"
 data-lang="{{ cond (eq .Language.Lang "en") "en" "zh-CN" }}" data-loading="lazy" crossorigin="anonymous" async></script></div>
{{ end }}
