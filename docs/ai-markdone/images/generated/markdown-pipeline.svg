<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Markdown and export pipeline concept</title>
  <desc id="desc">A rose and plum concept diagram showing source-aware copy and export outputs.</desc>
  <defs>
    <linearGradient id="brand" x1="80" x2="860" y1="100" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ad5389"/>
      <stop offset="1" stop-color="#3c1053"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="28" fill="#ffffff"/>
  <rect x="48" y="52" width="864" height="456" rx="24" fill="#f8f7fb" stroke="#e5e7eb"/>
  <text x="92" y="118" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="760">Copy and export pipeline</text>
  <text x="92" y="154" fill="#4b5563" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Keep useful source structure when content leaves ChatGPT.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="110" y="220" width="170" height="120" rx="18" fill="#fff" stroke="#e5e7eb"/>
    <text x="140" y="266" fill="#111827" font-size="18" font-weight="700">Selection</text>
    <text x="140" y="294" fill="#4b5563" font-size="14">answer / range / formula</text>
    <path d="M305 280h70" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
    <path d="m375 280-14-12v24z" fill="#3c1053"/>
    <rect x="404" y="198" width="210" height="164" rx="22" fill="#fff" stroke="#d9c0d5"/>
    <text x="438" y="246" fill="#111827" font-size="18" font-weight="700">Source-aware</text>
    <text x="438" y="276" fill="#4b5563" font-size="15">Markdown boundaries</text>
    <text x="438" y="302" fill="#4b5563" font-size="15">LaTeX extraction</text>
    <text x="438" y="328" fill="#4b5563" font-size="15">PNG/PDF rendering</text>
    <path d="M640 280h70" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
    <path d="m710 280-14-12v24z" fill="#3c1053"/>
    <g transform="translate(742 206)">
      <rect width="54" height="72" rx="10" fill="#fff" stroke="#ad5389"/>
      <text x="12" y="42" fill="#ad5389" font-size="14" font-weight="800">MD</text>
      <rect x="66" width="54" height="72" rx="10" fill="#fff" stroke="#ad5389"/>
      <text x="79" y="42" fill="#ad5389" font-size="14" font-weight="800">PDF</text>
      <rect x="32" y="88" width="54" height="72" rx="10" fill="url(#brand)"/>
      <text x="43" y="130" fill="#fff" font-size="14" font-weight="800">PNG</text>
    </g>
  </g>
</svg>
