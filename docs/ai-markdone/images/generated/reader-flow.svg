<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Reader workflow concept</title>
  <desc id="desc">A rose and plum concept diagram showing ChatGPT content moving into a clean Reader surface.</desc>
  <defs>
    <linearGradient id="brand" x1="90" x2="870" y1="80" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ad5389"/>
      <stop offset="1" stop-color="#3c1053"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" x2="1">
      <stop stop-color="#ad5389" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3c1053" stop-opacity=".16"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="28" fill="#ffffff"/>
  <rect x="44" y="44" width="872" height="472" rx="24" fill="url(#soft)" stroke="#ead7e7"/>
  <text x="92" y="112" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="760">Reader workflow</text>
  <text x="92" y="148" fill="#4b5563" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Turn a dense ChatGPT answer into a calm Markdown reading surface.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="92" y="220" width="190" height="128" rx="18" fill="#fff" stroke="#e5e7eb"/>
    <text x="124" y="262" fill="#111827" font-size="18" font-weight="700">ChatGPT answer</text>
    <rect x="124" y="286" width="120" height="10" rx="5" fill="#ead7e7"/>
    <rect x="124" y="310" width="96" height="10" rx="5" fill="#ead7e7"/>
    <path d="M306 284h86" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
    <path d="m392 284-15-12v24z" fill="#3c1053"/>
    <rect x="420" y="198" width="220" height="172" rx="22" fill="#fff" stroke="#d9c0d5"/>
    <text x="456" y="244" fill="#111827" font-size="18" font-weight="700">AI-MarkDone</text>
    <text x="456" y="274" fill="#4b5563" font-size="15">collects structure</text>
    <text x="456" y="300" fill="#4b5563" font-size="15">keeps Markdown boundaries</text>
    <text x="456" y="326" fill="#4b5563" font-size="15">opens focused Reader</text>
    <path d="M664 284h86" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
    <path d="m750 284-15-12v24z" fill="#3c1053"/>
    <rect x="778" y="180" width="90" height="210" rx="20" fill="url(#brand)"/>
    <rect x="796" y="214" width="54" height="8" rx="4" fill="#fff" opacity=".78"/>
    <rect x="796" y="238" width="42" height="8" rx="4" fill="#fff" opacity=".58"/>
    <rect x="796" y="278" width="54" height="8" rx="4" fill="#fff" opacity=".78"/>
    <rect x="796" y="302" width="36" height="8" rx="4" fill="#fff" opacity=".58"/>
    <text x="782" y="430" fill="#3c1053" font-size="15" font-weight="700">Reader</text>
  </g>
</svg>
