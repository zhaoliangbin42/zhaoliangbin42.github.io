# Native Hugo site. Language definitions live in config/_default/languages.toml.
baseURL = "https://zhaoliangbin42.github.io/"
title = "Liangbin Zhao"
timeZone = "Asia/Shanghai"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
summaryLength = 10
publishDir = "docs"
disableAliases = false

[services.googleAnalytics]
ID = "G-0TRYH6SRSY"

# Preserve existing top-level page URLs and historical aliases.
[permalinks.page]
pages = "/:slugorcontentbasename/"

[pagination]
pagerSize = 18
path = "page"

# The native CSS does not need Tailwind's generated HTML statistics.
[build.buildStats]
enable = false

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]

[imaging]
quality = 80
resampleFilter = "Lanczos"

[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
lineNumbersInTable = false
codeFences = true
guessSyntax = false

[markup.tableOfContents]
startLevel = 1
endLevel = 3
ordered = false

# Preserve authored TeX. MathJax is loaded only by pages opting into math.
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[taxonomies]
category = "categories"
tag = "tags"
author = "authors"

# Local mounts only: keep editor metadata on disk, outside published resources.
# These filters do not import a theme or any Go modules.
[[module.mounts]]
source = "content"
target = "content"
files = ["! vx*.json", "! **/vx*.json", "! vx_notebook/**", "! **/vx_notebook/**", "! .MWebMetaData/**", "! **/.MWebMetaData/**", "! .DS_Store", "! **/.DS_Store"]

[[module.mounts]]
source = "assets"
target = "assets"
files = ["! vx*.json", "! **/vx*.json", "! vx_notebook/**", "! **/vx_notebook/**", "! .MWebMetaData/**", "! **/.MWebMetaData/**", "! .DS_Store", "! **/.DS_Store"]

[[module.mounts]]
source = "static"
target = "static"
files = ["! vx*.json", "! **/vx*.json", "! vx_notebook/**", "! **/vx_notebook/**", "! .MWebMetaData/**", "! **/.MWebMetaData/**", "! .DS_Store", "! **/.DS_Store"]
